<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FinHQ — Hub</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            forest: { 900: '#0D3B2A', 800: '#164D38', 500: '#3D9162', 400: '#52B788', 50: '#F0F7F4' },
            cream: '#FAFCF8',
            gold: '#C8963E'
          },
          fontFamily: {
            display: ['"Cormorant Garamond"', 'serif'],
            body: ['"DM Sans"', 'sans-serif'],
          },
          boxShadow: {
            card: '0 4px 12px -4px rgba(13,59,42,0.1), 0 0 0 1px rgba(13,59,42,0.02)'
          }
        }
      }
    }
  </script>

  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-cream text-forest-900 antialiased selection:bg-forest-400">

  <div class="max-w-md mx-auto min-h-screen bg-cream flex flex-col relative pb-10 shadow-2xl">
    
    <header class="px-6 pt-8 pb-4">
      <div class="font-display text-3xl font-semibold tracking-tight text-center">
        Fin<span class="text-gold">HQ</span>
      </div>
    </header>

    <main class="flex-1 px-5 space-y-8">
      
      <section class="space-y-3" id="layer-1">
        
        <div class="bg-forest-900 text-white rounded-3xl p-6 shadow-card relative overflow-hidden">
          <div class="absolute top-0 right-0 w-32 h-32 bg-forest-800 rounded-full -mr-10 -mt-10 opacity-50"></div>
          <p class="text-xs text-forest-400 font-semibold tracking-widest uppercase mb-1 relative z-10">Total Net Worth</p>
          <p class="font-display text-4xl font-semibold relative z-10">₹2,84,370</p>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div class="bg-white rounded-2xl p-5 shadow-card border border-forest-50/50">
            <p class="text-[10px] text-forest-400 font-semibold tracking-widest uppercase mb-1">Liquid Cash</p>
            <p class="font-display text-2xl font-semibold text-forest-900">₹42,100</p>
          </div>
          <div class="bg-white rounded-2xl p-5 shadow-card border border-forest-50/50">
            <p class="text-[10px] text-forest-400 font-semibold tracking-widest uppercase mb-1">Month Spend</p>
            <p class="font-display text-2xl font-semibold text-red-500">₹14,230</p>
          </div>
        </div>
      </section>

      <section id="layer-2">
        <h2 class="text-xs font-semibold text-forest-500 tracking-widest uppercase mb-4 px-1">Modules</h2>
        
        <div class="grid grid-cols-2 gap-3">
          
          <button class="bg-white rounded-2xl p-5 shadow-card border border-forest-50/50 flex flex-col items-start gap-4 hover:bg-forest-50 transition-colors text-left active:scale-95 duration-200">
            <div class="w-10 h-10 rounded-full bg-forest-50 flex items-center justify-center text-forest-500">
              <i data-lucide="book-text" class="w-5 h-5"></i>
            </div>
            <div>
              <p class="font-semibold text-forest-900">Ledger</p>
              <p class="text-xs text-forest-400 mt-0.5">Daily cashflow</p>
            </div>
          </button>

          <button class="bg-white rounded-2xl p-5 shadow-card border border-forest-50/50 flex flex-col items-start gap-4 hover:bg-forest-50 transition-colors text-left active:scale-95 duration-200">
            <div class="w-10 h-10 rounded-full bg-orange-50 flex items-center justify-center text-gold">
              <i data-lucide="trending-up" class="w-5 h-5"></i>
            </div>
            <div>
              <p class="font-semibold text-forest-900">Wealth</p>
              <p class="text-xs text-forest-400 mt-0.5">Assets & FDs</p>
            </div>
          </button>

          <button class="bg-white rounded-2xl p-5 shadow-card border border-forest-50/50 flex flex-col items-start gap-4 hover:bg-forest-50 transition-colors text-left active:scale-95 duration-200">
            <div class="w-10 h-10 rounded-full bg-red-50 flex items-center justify-center text-red-500">
              <i data-lucide="landmark" class="w-5 h-5"></i>
            </div>
            <div>
              <p class="font-semibold text-forest-900">Debt</p>
              <p class="text-xs text-forest-400 mt-0.5">Loans & EMI</p>
            </div>
          </button>

          <button class="bg-white rounded-2xl p-5 shadow-card border border-forest-50/50 flex flex-col items-start gap-4 hover:bg-forest-50 transition-colors text-left active:scale-95 duration-200">
            <div class="w-10 h-10 rounded-full bg-blue-50 flex items-center justify-center text-blue-500">
              <i data-lucide="pie-chart" class="w-5 h-5"></i>
            </div>
            <div>
              <p class="font-semibold text-forest-900">Insights</p>
              <p class="text-xs text-forest-400 mt-0.5">CSV & Data</p>
            </div>
          </button>

        </div>
      </section>

    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
