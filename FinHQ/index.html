<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinHQ — Lifelong Finance</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            forest: { 900: '#0D3B2A', 800: '#164D38', 700: '#1B5E3B', 500: '#3D9162', 400: '#52B788', 300: '#74C69D', 50: '#F0F7F4' },
            cream: '#FAFCF8',
            gold: '#C8963E'
          },
          fontFamily: {
            display: ['"Cormorant Garamond"', 'serif'],
            body: ['"DM Sans"', 'sans-serif'],
          },
          boxShadow: {
            card: '0 2px 8px -2px rgba(13,59,42,0.08), 0 0 0 1px rgba(13,59,42,0.03)'
          }
        }
      }
    }
  </script>

  <script src="https://unpkg.com/lucide@latest"></script>
  
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-cream text-forest-900 antialiased">

  <div class="flex min-h-screen flex-col md:flex-row">
    
    <div class="md:hidden flex items-center justify-between p-4 bg-white border-b border-forest-50">
      <div class="font-display text-2xl font-semibold tracking-tight">
        Fin<span class="text-gold">HQ</span>
      </div>
      <button id="mobileMenuBtn" class="text-forest-900">
        <i data-lucide="menu"></i>
      </button>
    </div>

    <aside id="sidebar" class="w-full md:w-60 shrink-0 border-r border-forest-50 bg-white flex-col py-8 px-4 gap-2 hidden md:flex">
      <div class="hidden md:block mb-10 px-4">
        <div class="font-display text-3xl font-semibold tracking-tight">
          Fin<span class="text-gold">HQ</span>
        </div>
        <p class="text-xs text-forest-400 mt-1">Lifelong Finance</p>
      </div>

      <button class="flex items-center gap-3 w-full px-4 py-2.5 rounded-xl text-sm font-medium transition-colors bg-forest-50 text-forest-800">
        <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Dashboard
      </button>
      <button class="flex items-center gap-3 w-full px-4 py-2.5 rounded-xl text-sm font-medium transition-colors text-forest-500 hover:bg-forest-50 hover:text-forest-800">
        <i data-lucide="book-text" class="w-4 h-4"></i> Ledger
      </button>
      <button class="flex items-center gap-3 w-full px-4 py-2.5 rounded-xl text-sm font-medium transition-colors text-forest-500 hover:bg-forest-50 hover:text-forest-800">
        <i data-lucide="wallet" class="w-4 h-4"></i> Accounts
      </button>
    </aside>

    <main class="flex-1 overflow-auto p-4 md:p-10">
      <div class="max-w-5xl mx-auto space-y-10">
        
        <h1 class="font-display text-4xl font-semibold text-forest-900">Dashboard</h1>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-5" id="kpiContainer"></div>

        <section>
          <h2 class="text-sm font-semibold text-forest-500 uppercase tracking-wider mb-4">Accounts</h2>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-5" id="accountsContainer"></div>
        </section>

        <section>
          <h2 class="text-sm font-semibold text-forest-500 uppercase tracking-wider mb-4">Recent Transactions</h2>
          <div class="bg-white rounded-2xl shadow-card overflow-hidden">
            <div class="divide-y divide-forest-50" id="transactionsContainer"></div>
          </div>
        </section>

      </div>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  
  <script src="firebase-config.js"></script>
  
  <script src="app.js"></script>
</body>
</html>
